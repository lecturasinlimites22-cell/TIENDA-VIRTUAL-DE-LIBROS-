$kind: http-request
name: ConsultarCategoria
description: |-
  ## Consultar Categorías

  Retorna el listado completo de categorías de libros registradas en el sistema.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `GET` |
  | URL     | `http://127.0.0.1:8000/api/categorias` |

  ### ✅ Respuesta esperada
  - **200 OK** – Lista de categorías obtenida correctamente.
  - **404 Not Found** – No se encontraron categorías registradas.
url: http://127.0.0.1:8000/api/categorias
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: ""
order: 46000
