$kind: http-request
name: CosultarAutor
description: |-
  ## Consultar Autores

  Retorna el listado completo de autores registrados en el sistema.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `GET` |
  | URL     | `http://127.0.0.1:8000/api/autores` |

  ### ✅ Respuesta esperada
  - **200 OK** – Lista de autores obtenida correctamente.
  - **404 Not Found** – No se encontraron autores registrados.
url: http://127.0.0.1:8000/api/autores
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: ""
order: 41000
