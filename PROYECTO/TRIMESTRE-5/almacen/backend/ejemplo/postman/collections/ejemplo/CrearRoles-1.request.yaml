$kind: http-request
name: CrearRoles
description: |-
  ## Crear Rol

  Registra un nuevo rol en el sistema con su nombre y descripción.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `POST` |
  | URL     | `http://127.0.0.1:8000/api/roles` |

  ### 📥 Body (JSON)
  | Campo          | Tipo   | Descripción              |
  |----------------|--------|--------------------------|
  | `id_rol`       | string | ID del rol               |
  | `nombre`       | string | Nombre del rol           |
  | `descripcion`  | string | Descripción del rol      |

  ### ✅ Respuesta esperada
  - **201 Created** – Rol creado correctamente.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/roles
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \    \"id_rol\":\"13\",\r

    \    \"nombre\":\"usuario\",\r

    \    \"descripcion\":\"comprador\"\r

    }"
order: 4000
