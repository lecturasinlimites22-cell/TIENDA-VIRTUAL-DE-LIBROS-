$kind: http-request
name: EliminarCategoria
description: |-
  ## Eliminar Categoría

  Elimina una categoría del sistema identificada por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `DELETE` |
  | URL     | `http://127.0.0.1:8000/api/categorias/18` |

  ### 📥 Parámetros
  | Campo      | Tipo | Descripción                  |
  |------------|------|------------------------------|
  | `id`       | int  | ID de la categoría a eliminar |

  ### ✅ Respuesta esperada
  - **200 OK** – Categoría eliminada correctamente.
  - **404 Not Found** – La categoría no existe.
url: http://127.0.0.1:8000/api/categorias/18
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \    \"id_categoria\": 18,\r

    \    \"nombre\": \"Literatura\",\r

    \    \"descripcion\": \"infantil y juvenil\"\r

    }"
order: 50000
