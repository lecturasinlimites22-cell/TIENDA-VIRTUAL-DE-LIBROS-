$kind: http-request
name: EliminarRol
description: |-
  ## Eliminar Rol

  Elimina un rol del sistema identificado por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `DELETE` |
  | URL     | `http://127.0.0.1:8000/api/roles/11` |

  ### 📥 Parámetros
  | Campo      | Tipo | Descripción             |
  |------------|------|-------------------------|
  | `id`       | int  | ID del rol a eliminar   |

  ### ✅ Respuesta esperada
  - **200 OK** – Rol eliminado correctamente.
  - **404 Not Found** – El rol no existe.
url: http://127.0.0.1:8000/api/roles/11
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \    \"id_rol\":\"11\",\r

    \    \"nombre\":\"admin\",\r

    \    \"descripcion\":\"vendedor\"\r

    }\r\n"
order: 6000
