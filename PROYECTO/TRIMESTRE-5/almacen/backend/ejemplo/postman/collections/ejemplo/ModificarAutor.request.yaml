$kind: http-request
name: ModificarAutor
description: |-
  ## Modificar Autor

  Actualiza los datos de un autor existente en el sistema identificado por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `PUT` |
  | URL     | `http://127.0.0.1:8000/api/autores/17` |

  ### 📥 Body (JSON)
  | Campo      | Tipo   | Descripción              |
  |------------|--------|--------------------------|
  | `id_autor` | int    | ID del autor             |
  | `nombre`   | string | Nuevo nombre del autor   |

  ### ✅ Respuesta esperada
  - **200 OK** – Autor actualizado correctamente.
  - **404 Not Found** – El autor no existe.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/autores/17
method: PUT
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \        \"id_autor\": 17,\r

    \        \"nombre\": \"Antoine Marie Jean-Baptiste Roger de
    Saint-Exupéry\"\r

    \    }"
order: 44000
