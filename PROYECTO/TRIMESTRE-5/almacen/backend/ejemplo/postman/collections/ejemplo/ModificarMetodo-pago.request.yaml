$kind: http-request
name: ModificarMetodo-pago
description: |-
  ## Modificar Método de Pago

  Actualiza los datos de un método de pago existente en el sistema identificado por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `PUT` |
  | URL     | `http://127.0.0.1:8000/api/metodos-pago/17` |

  ### 📥 Body (JSON)
  | Campo            | Tipo   | Descripción                        |
  |------------------|--------|------------------------------------|
  | `id_metodo_pago` | int    | ID del método de pago              |
  | `nombre`         | string | Nuevo nombre del método de pago    |

  ### ✅ Respuesta esperada
  - **200 OK** – Método de pago actualizado correctamente.
  - **404 Not Found** – El método de pago no existe.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/metodos-pago/17
method: PUT
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \        \"id_metodo_pago\": 17,\r

    \        \"nombre\": \"Nequi\"\r

    \    }"
order: 29000
