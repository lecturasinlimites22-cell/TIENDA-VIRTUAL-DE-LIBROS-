$kind: http-request
name: ConsultarPago
description: |-
  ## Consultar Pagos

  Retorna el listado completo de pagos registrados en el sistema.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `GET` |
  | URL     | `http://127.0.0.1:8000/api/pagos` |

  ### ✅ Respuesta esperada
  - **200 OK** – Lista de pagos obtenida correctamente.
  - **404 Not Found** – No se encontraron pagos registrados.
url: http://127.0.0.1:8000/api/pagos
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: ""
order: 21000
