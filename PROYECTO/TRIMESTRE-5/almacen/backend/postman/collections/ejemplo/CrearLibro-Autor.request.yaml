$kind: http-request
name: CrearLibro-Autor
description: |-
  ## Crear Relación Libro-Autor

  Registra una nueva relación entre un libro y un autor en el sistema.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `POST` |
  | URL     | `http://127.0.0.1:8000/api/libro-autores` |

  ### 📥 Body (JSON)
  | Campo      | Tipo | Descripción          |
  |------------|------|----------------------|
  | `id_libro` | int  | ID del libro         |
  | `id_autor` | int  | ID del autor         |

  ### ✅ Respuesta esperada
  - **201 Created** – Relación libro-autor creada correctamente.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/libro-autores
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \        \"id_libro\": 19,\r

    \        \"id_autor\": 19\r

    \    }"
order: 68000
