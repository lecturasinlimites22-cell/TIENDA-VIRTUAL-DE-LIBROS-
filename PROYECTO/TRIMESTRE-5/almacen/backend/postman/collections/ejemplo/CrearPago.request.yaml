$kind: http-request
name: CrearPago
description: |-
  ## Crear Pago

  Registra un nuevo pago asociado a una venta y un método de pago en el sistema.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `POST` |
  | URL     | `http://127.0.0.1:8000/api/pagos/17` |

  ### 📥 Body (JSON)
  | Campo            | Tipo    | Descripción                      |
  |------------------|---------|----------------------------------|
  | `id_pago`        | int     | ID del pago                      |
  | `id_venta`       | int     | ID de la venta asociada          |
  | `id_metodo_pago` | int     | ID del método de pago utilizado  |
  | `monto`          | decimal | Monto del pago                   |
  | `fecha_pago`     | string  | Fecha y hora del pago            |

  ### ✅ Respuesta esperada
  - **201 Created** – Pago creado correctamente.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/pagos/17
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \        \"id_pago\": 17,\r

    \        \"id_venta\": 21,\r

    \        \"id_metodo_pago\": 17,\r

    \        \"monto\": null,\r

    \        \"fecha_pago\": null\r

    \    }"
order: 23000
