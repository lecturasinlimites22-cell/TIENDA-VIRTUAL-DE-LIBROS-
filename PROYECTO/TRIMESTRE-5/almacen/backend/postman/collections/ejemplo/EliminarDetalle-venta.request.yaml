$kind: http-request
name: EliminarDetalle-venta
description: |-
  ## Eliminar Detalle de Venta

  Elimina un detalle de venta del sistema identificado por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `DELETE` |
  | URL     | `http://127.0.0.1:8000/api/detalles-venta/17` |

  ### 📥 Parámetros
  | Campo      | Tipo | Descripción                          |
  |------------|------|--------------------------------------|
  | `id`       | int  | ID del detalle de venta a eliminar   |

  ### ✅ Respuesta esperada
  - **200 OK** – Detalle de venta eliminado correctamente.
  - **404 Not Found** – El detalle de venta no existe.
url: http://127.0.0.1:8000/api/detalles-venta/17
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \    \"id_detalle\": 17,\r

    \    \"id_venta\": 17,\r

    \    \"id_libro\": null,\r

    \    \"cantidad\": 5,\r

    \    \"precio_unitario\": \"100000.00\"\r

    }"
order: 35000
