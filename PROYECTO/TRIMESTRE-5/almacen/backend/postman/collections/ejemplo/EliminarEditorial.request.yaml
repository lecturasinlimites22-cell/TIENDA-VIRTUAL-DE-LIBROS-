$kind: http-request
name: EliminarEditorial
description: |-
  ## Eliminar Editorial

  Elimina una editorial del sistema identificada por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `DELETE` |
  | URL     | `http://127.0.0.1:8000/api/editoriales/17` |

  ### 📥 Parámetros
  | Campo      | Tipo | Descripción                    |
  |------------|------|--------------------------------|
  | `id`       | int  | ID de la editorial a eliminar  |

  ### ✅ Respuesta esperada
  - **200 OK** – Editorial eliminada correctamente.
  - **404 Not Found** – La editorial no existe.
url: http://127.0.0.1:8000/api/editoriales/17
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \        \"id_editorial\": 17,\r

    \        \"nombre\": \"Norma\",\r

    \        \"pais\": \"España\"\r

    \        }  "
order: 60000
