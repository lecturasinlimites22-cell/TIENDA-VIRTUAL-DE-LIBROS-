$kind: http-request
description: |-
  ## Modificar Empleado

  Actualiza los datos de un empleado existente en el sistema identificado por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `PUT` |
  | URL     | `http://127.0.0.1:8000/api/empleados/18` |

  ### 📥 Body (JSON)
  | Campo         | Tipo   | Descripción                      |
  |---------------|--------|----------------------------------|
  | `id_empleado` | int    | ID del empleado                  |
  | `nombre`      | string | Nuevo nombre del empleado        |
  | `apellido`    | string | Nuevo apellido del empleado      |
  | `telefono`    | string | Nuevo teléfono del empleado      |
  | `cargo`       | string | Nuevo cargo del empleado         |
  | `id_usuario`  | int    | ID del usuario asociado          |

  ### ✅ Respuesta esperada
  - **200 OK** – Empleado actualizado correctamente.
  - **404 Not Found** – El empleado no existe.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/empleados/18
method: PUT
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \    \"id_empleado\": 18,\r

    \    \"nombre\": \"Andres\",\r

    \    \"apellido\": \"Felipe\",\r

    \    \"telefono\": \"312457859\",\r

    \    \"cargo\": \"Gerente\",\r

    \    \"id_usuario\": null\r

    \  }"
order: 64000
