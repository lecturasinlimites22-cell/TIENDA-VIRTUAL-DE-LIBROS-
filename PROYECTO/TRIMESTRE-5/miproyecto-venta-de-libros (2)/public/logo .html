<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo Libro Digital — SVG 100% Código</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  overflow:hidden;display:grid;place-items:center;
  background:transparent;
}
.logo{width:min(98vw,980px);height:min(98vh,980px);perspective:1400px;background:transparent}
svg{width:100%;height:100%;display:block;overflow:visible}
.book{transform-origin:450px 500px;animation:bookFloat 4.8s ease-in-out infinite}
.orbit{transform-origin:450px 450px;animation:spin 18s linear infinite}
.orbit.r{animation-direction:reverse;animation-duration:12s}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.tw{animation:twinkle 2.2s ease-in-out infinite}
.page{transform-box:fill-box;transform-origin:bottom center}
@keyframes bookFloat{0%,100%{transform:translateY(0) rotateZ(0)}50%{transform:translateY(-7px) rotateZ(.35deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@media(max-width:600px){.logo{width:100vw;height:100vw}}
</style>
</head>
<body>
<div class="logo" id="logo">

<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Fondo -->
<radialGradient id="bg">
 <stop offset="0" stop-color="#0b3b70" stop-opacity=".55"/>
 <stop offset=".42" stop-color="#052347" stop-opacity=".35"/>
 <stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>

<!-- Oro -->
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#fff9bd"/>
 <stop offset=".13" stop-color="#e4a52f"/>
 <stop offset=".30" stop-color="#fff0a0"/>
 <stop offset=".52" stop-color="#a9670d"/>
 <stop offset=".72" stop-color="#ffdc6b"/>
 <stop offset="1" stop-color="#7b4708"/>
</linearGradient>

<linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0" stop-color="#754306"/>
 <stop offset=".35" stop-color="#f8ca59"/>
 <stop offset=".55" stop-color="#fff2a0"/>
 <stop offset="1" stop-color="#9a5d0a"/>
</linearGradient>

<!-- Cuero azul/negro -->
<linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#253b5a"/>
 <stop offset=".18" stop-color="#122641"/>
 <stop offset=".5" stop-color="#071528"/>
 <stop offset=".82" stop-color="#020814"/>
 <stop offset="1" stop-color="#00030a"/>
</linearGradient>

<!-- Páginas -->
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#fffef0"/>
 <stop offset=".24" stop-color="#f7f0d2"/>
 <stop offset=".55" stop-color="#ddd3b1"/>
 <stop offset=".82" stop-color="#b1a586"/>
 <stop offset="1" stop-color="#6d644f"/>
</linearGradient>

<!-- Azul -->
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#d5ffff"/>
 <stop offset=".18" stop-color="#2fffff"/>
 <stop offset=".45" stop-color="#00bfff"/>
 <stop offset=".72" stop-color="#0065ff"/>
 <stop offset="1" stop-color="#111ca8"/>
</linearGradient>

<radialGradient id="gem" cx=".28" cy=".18">
 <stop offset="0" stop-color="#fff"/>
 <stop offset=".16" stop-color="#c8ffff"/>
 <stop offset=".4" stop-color="#19eaff"/>
 <stop offset=".72" stop-color="#0872ff"/>
 <stop offset="1" stop-color="#091b9f"/>
</radialGradient>

<!-- Holograma -->
<linearGradient id="holo" x1="0" y1="1" x2="1" y2="0">
 <stop offset="0" stop-color="#001d70"/>
 <stop offset=".35" stop-color="#006cff"/>
 <stop offset=".7" stop-color="#00dfff"/>
 <stop offset="1" stop-color="#0750e9"/>
</linearGradient>

<!-- Textura sutil de cuero -->
<filter id="texture">
 <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="8" result="n"/>
 <feColorMatrix in="n" type="saturate" values="0" result="g"/>
 <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>

<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
 <feGaussianBlur stdDeviation="6" result="b"/>
 <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
 <feGaussianBlur stdDeviation="17" result="b"/>
 <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<filter id="shadow" x="-100%" y="-100%" width="300%" height="300%">
 <feGaussianBlur stdDeviation="18"/>
</filter>

<filter id="whiteGlow" x="-100%" y="-100%" width="300%" height="300%">
 <feGaussianBlur stdDeviation="2.5" result="b"/>
 <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<script>
/* Movimiento 3D suave con el mouse */
const logo=document.getElementById("logo");

window.addEventListener("pointermove",e=>{
  const x=(e.clientX/window.innerWidth-.5)*2;
  const y=(e.clientY/window.innerHeight-.5)*2;

  logo.style.transform=
    `rotateX(${y*-3.5}deg) rotateY(${x*4.5}deg)`;
});

window.addEventListener("pointerleave",()=>{
  logo.style.transform="rotateX(0deg) rotateY(0deg)";
});
</script>
