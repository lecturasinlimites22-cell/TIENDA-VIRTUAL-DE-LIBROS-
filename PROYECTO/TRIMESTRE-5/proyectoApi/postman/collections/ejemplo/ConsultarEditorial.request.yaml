$kind: http-request
name: ConsultarEditorial
description: |-
  ## Consultar Editoriales

  Retorna el listado completo de editoriales registradas en el sistema.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `GET` |
  | URL     | `http://127.0.0.1:8000/api/editoriales` |

  ### ✅ Respuesta esperada
  - **200 OK** – Lista de editoriales obtenida correctamente.
  - **404 Not Found** – No se encontraron editoriales registradas.
url: http://127.0.0.1:8000/api/editoriales
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: ""
order: 56000
