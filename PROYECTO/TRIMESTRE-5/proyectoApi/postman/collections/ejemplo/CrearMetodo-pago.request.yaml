$kind: http-request
name: CrearMetodo-pago
description: |-
  ## Crear Método de Pago

  Registra un nuevo método de pago en el sistema con su nombre.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `POST` |
  | URL     | `http://127.0.0.1:8000/api/metodos-pago` |

  ### 📥 Body (JSON)
  | Campo             | Tipo   | Descripción                  |
  |-------------------|--------|------------------------------|
  | `id_metodo_pago`  | int    | ID del método de pago        |
  | `nombre`          | string | Nombre del método de pago    |

  ### ✅ Respuesta esperada
  - **201 Created** – Método de pago creado correctamente.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/metodos-pago
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \        \"id_metodo_pago\": 17,\r

    \        \"nombre\": \"Efectivo\"\r

    \    }"
order: 28000
