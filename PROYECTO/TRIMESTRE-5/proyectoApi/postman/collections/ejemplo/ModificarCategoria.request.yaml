$kind: http-request
name: ModificarCategoria
description: |-
  ## Modificar Categoría

  Actualiza los datos de una categoría existente en el sistema identificada por su ID.

  ---

  ### 🔧 Detalles técnicos
  | Campo   | Valor |
  |---------|-------|
  | Método  | `PUT` |
  | URL     | `http://127.0.0.1:8000/api/categorias/17` |

  ### 📥 Body (JSON)
  | Campo          | Tipo   | Descripción                      |
  |----------------|--------|----------------------------------|
  | `id_categoria` | int    | ID de la categoría               |
  | `nombre`       | string | Nuevo nombre de la categoría     |
  | `descripcion`  | string | Nueva descripción de la categoría |

  ### ✅ Respuesta esperada
  - **200 OK** – Categoría actualizada correctamente.
  - **404 Not Found** – La categoría no existe.
  - **400 Bad Request** – Datos inválidos o incompletos.
url: http://127.0.0.1:8000/api/categorias/17
method: PUT
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: "{\r

    \    \"id_categoria\": 17,\r

    \    \"nombre\": \"Literatura\",\r

    \    \"descripcion\": \"infantil y juvenil\"\r

    }"
order: 49000
